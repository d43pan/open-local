name: Suggest an improvement
description: An idea for the skills, the tools, the schema or the documentation.
title: "Idea: "
labels: [improvement]
body:
  - type: textarea
    id: problem
    attributes: {label: What were you trying to do?}
    validations: {required: true}
  - type: textarea
    id: idea
    attributes: {label: What would help?}
    validations: {required: true}
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: [Asking about a place (open-local skill), Adding a place (open-local-build skill), Registry format, Tools, Documentation, Places outside the US, Governance, Other]
