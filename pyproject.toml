[project]
name = "open-local"
version = "0.1.0"
description = "A public registry of where local information lives, and small tools to use it."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = []          # the tools need only the standard library

[project.optional-dependencies]
dev = ["pyyaml>=6", "jsonschema>=4.18", "pytest>=8"]   # to validate and rebuild the registry, and run tests

[project.scripts]
open-local = "openlocal.cli:main"

[project.urls]
Repository = "https://github.com/d43pan/open-local"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["skills/open-local/scripts"]
include = ["openlocal*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: needs the internet; run on a schedule, not on pull requests"]
addopts = "-m 'not network'"
